services:
  # ──────────────────────────────────────────────
  # Backend — PHP REST API
  # ──────────────────────────────────────────────
  - type: web
    name: foodexpress-api
    env: php
    branch: main
    buildCommand: ''
    startCommand: php -S 0.0.0.0:10000 -t backend backend/router.php
    plan: free
    envVars:
      # Base de Dados (Neon PostgreSQL)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: '3600'
      - key: JWT_REFRESH_EXP
        value: '2592000'
      # Brevo Email API
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: FoodExpress
      # URL do frontend (para links nos emails)
      - key: FRONTEND_URL
        sync: false

  # ──────────────────────────────────────────────
  # Frontend — Angular SSR (Node.js)
  # ──────────────────────────────────────────────
  - type: web
    name: foodexpress-frontend
    env: node
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/FoodExpress/server/server.mjs
    plan: free
    envVars:
      - key: PORT
        value: '4000'
      - key: NODE_ENV
        value: production
