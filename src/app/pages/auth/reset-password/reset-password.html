<app-navbar />

<section class="auth-page">
  <div class="auth-card">
    <h1>{{ i18n.t('passwordReset') }}</h1>
    <p class="auth-subtitle">Introduza o seu e-mail para receber um link de recuperação</p>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" class="auth-form">
      <label>
        {{ i18n.t('loginEmail') }}
        <input type="email" formControlName="email" placeholder="email@exemplo.com" [class.input-error]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched" required />
      </label>
      @if (resetForm.get('email')?.invalid && resetForm.get('email')?.touched) {
        <span class="validation-message">Por favor, insira um e-mail válido.</span>
      }

      @if (error) {
        <div class="form-error">{{ error }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        @if (loading) {
          <span>Enviando...</span>
        } @else {
          {{ i18n.t('resetButton') || 'Enviar link' }}
        }
      </button>
    </form>

    @if (success) {
      <div class="success-message" style="margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: #d1fae5; color: #065f46;">
        {{ i18n.t('emailSent') }}
      </div>
    }

    <p class="auth-footer">
      <a routerLink="/login">{{ i18n.t('login') }}</a>
    </p>
  </div>
</section>
