<app-navbar />

<section class="auth-page">
  <div class="auth-card">
    <h1>{{ i18n.t('passwordReset') }}</h1>
    <p class="auth-subtitle">{{ i18n.t('emailSent') }}</p>

    <form (ngSubmit)="submit()" class="auth-form">
      <label>
        {{ i18n.t('loginEmail') }}
        <input type="email" [(ngModel)]="email" name="email" placeholder="email@exemplo.com" required />
      </label>

      <button type="submit" class="btn-primary">{{ i18n.t('resetButton') || 'Enviar link' }}</button>
    </form>

    @if (success) {
      <div class="success-message">{{ i18n.t('emailSent') }}</div>
    }

    <p class="auth-footer">
      <a routerLink="/login">{{ i18n.t('login') }}</a>
    </p>
  </div>
</section>
